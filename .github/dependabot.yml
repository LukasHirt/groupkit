version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/test/pyclient"
    schedule:
      interval: "weekly"
    ignore:
      # recurring-ical-events requires python-dateutil<3.
      - dependency-name: "python-dateutil"
        update-types: ["version-update:semver-major"]
