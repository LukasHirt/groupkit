name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # The token is a fine-grained personal access token. Pull requests opened
      # with the default token do not start the CI workflow.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # release-please can't sign off its commit, and the DCO check requires a
      # sign-off. The commit author is the owner of the token, so the sign-off
      # carries the author's own name and email.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - name: Sign off the release commit
        run: |
          branch=release-please--branches--main
          if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "No release pull request is open."
            exit 0
          fi
          git fetch --quiet origin "$branch"
          tip=$(git rev-parse FETCH_HEAD)
          git checkout --quiet -B "$branch" "$tip"
          message=$(git log -1 --format=%B)
          case "$message" in
            *"Signed-off-by: "*)
              echo "The release commit is already signed off."
              exit 0
              ;;
          esac
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          git commit --quiet --amend --signoff --no-edit
          git push --force-with-lease="$branch:$tip" origin "$branch"
