name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -cover

  fuzz:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Runs every fuzz target for a few seconds. A crash fails the job and the
      # failing input is printed in the log.
      - name: Fuzz every target briefly
        run: |
          # When -fuzztime runs out, go test can exit with "context deadline
          # exceeded" although nothing failed (golang/go#75804, golang/go#72104).
          # That case is retried once. A real failure writes an input file and
          # is never retried.
          run_target() {
            local pkg=$1 target=$2 log attempt
            log=$(mktemp)
            for attempt in 1 2; do
              if go test "$pkg" -run '^$' -fuzz "^${target}\$" -fuzztime 10s >"$log" 2>&1; then
                cat "$log"
                return 0
              fi
              cat "$log"
              if [ "$attempt" = 2 ] || grep -q 'Failing input written to' "$log" ||
                ! grep -q 'context deadline exceeded' "$log"; then
                return 1
              fi
              echo "== $pkg $target: deadline error without a failing input, retrying"
            done
          }
          status=0
          for pkg in $(go list ./...); do
            if ! listed=$(go test -list '^Fuzz' "$pkg" 2>&1); then
              echo "== $pkg does not build"
              echo "$listed"
              status=1
              continue
            fi
            for target in $(echo "$listed" | grep '^Fuzz' || true); do
              echo "== $pkg $target"
              run_target "$pkg" "$target" || status=1
            done
          done
          for input in $(git ls-files --others --exclude-standard -- '*testdata/fuzz/*'); do
            echo "== failing input $input"
            cat "$input"
          done
          exit $status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  reuse-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  # Informational until the API is promised: a finding is a warning and does
  # not fail the check. To make it required, delete continue-on-error and add
  # api-check to the required status checks (see CONTRIBUTING.md).
  api-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Compare the exported API with the latest release
        run: scripts/apidiff

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  python-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the Python client
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r test/pyclient/requirements.txt
      - name: Build the example server
        run: go build -o "$RUNNER_TEMP/server" ./examples/server
      - name: Run the client against the server
        env:
          GROUPKIT_PASSWORD: ci-check-password-1
          GROUPKIT_URL: http://127.0.0.1:8080/dav/
        run: |
          "$RUNNER_TEMP/server" -addr 127.0.0.1:8080 -data "$RUNNER_TEMP/data" &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 1 50); do
            curl -s -o /dev/null http://127.0.0.1:8080/ && break
            sleep 0.2
          done
          "$RUNNER_TEMP/venv/bin/python" -I test/pyclient/accept.py

  evolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the example server
        run: go build -o "$RUNNER_TEMP/server" ./examples/server
      - name: Build the Evolution data server image
        run: docker build -t groupkit-evolution test/evolution
      - name: Run Evolution's data server against the example server
        env:
          GROUPKIT_PASSWORD: ci-check-password-1
        run: |
          "$RUNNER_TEMP/server" -addr 127.0.0.1:8080 -data "$RUNNER_TEMP/data" &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 1 50); do
            curl -s -o /dev/null http://127.0.0.1:8080/ && break
            sleep 0.2
          done
          docker run --rm --network host \
            -e GROUPKIT_PASSWORD -e GROUPKIT_URL=http://127.0.0.1:8080/dav/ \
            -v "$PWD/test/evolution/check.py:/check.py:ro" \
            groupkit-evolution dbus-run-session -- python3 -I /check.py
